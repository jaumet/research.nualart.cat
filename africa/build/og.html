<!doctype html>
<!--
  Imatge per compartir (Open Graph), 1200×630. La genera build/og.sh amb Chrome sense finestra.
  Paràmetres: ?lang=ca|en  &kids=1 (versió per a escoles)
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { --bg: #14110f; --ink: #efe6d8; --ink2: #b9ab97; --accent: #d2452f; --gold: #e3b23c;
         background: var(--bg); color: var(--ink); font-family: "Palatino Linotype", Palatino, "DejaVu Serif", Georgia, serif; position: relative; }
  body.kids { --bg: #fbf5e9; --ink: #2b2118; --ink2: #5c4a3b; --accent: #c4512f; --gold: #f2b134; font-family: Quicksand, "DejaVu Sans", sans-serif; }
  svg { position: absolute; right: 18px; top: 0; height: 630px; }
  .text { position: absolute; left: 64px; top: 0; bottom: 0; width: 620px; display: flex; flex-direction: column; justify-content: center; }
  .eyebrow { font-family: "DejaVu Sans", sans-serif; font-size: 20px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 0 0 18px; }
  h1 { font-size: 80px; line-height: .98; font-weight: 600; margin: 0 0 22px; letter-spacing: -.01em; }
  body.kids h1 { font-weight: 700; font-size: 84px; }
  .badge[hidden], .eyebrow[hidden] { display: none; }
  .sub { font-size: 29px; line-height: 1.3; color: var(--ink2); margin: 0 0 34px; max-width: 560px; }
  .stats { display: flex; gap: 34px; }
  .stats div { display: flex; flex-direction: column; }
  .stats b { font-size: 50px; line-height: 1; color: var(--accent); font-weight: 600; }
  .stats span { font-family: "DejaVu Sans", sans-serif; font-size: 16px; line-height: 1.3; color: var(--ink2); margin-top: 8px; max-width: 170px; }
  .pill { position: absolute; right: 30px; bottom: 26px; font-family: "DejaVu Sans", sans-serif; font-size: 18px; font-weight: 700; color: var(--ink2); }
  .badge { display: inline-block; align-self: flex-start; background: var(--gold); color: #2b2118; font-weight: 700; font-size: 24px; padding: 8px 20px; border-radius: 999px; margin: 0 0 22px; }
</style>
</head>
<body>
<svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
<div class="text">
  <p class="eyebrow" id="eyebrow"></p>
  <span class="badge" id="badge" hidden></span>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <div class="stats" id="stats"></div>
</div>
<div class="pill">research.nualart.cat/africa</div>
<script src="../data/geo.js"></script>
<script src="../js/history.js"></script>
<script>
  const q = new URLSearchParams(location.search), lang = q.get("lang") || "ca", kids = q.get("kids") === "1";
  const G = window.GEO, H = window.HISTORY;
  if (kids) document.body.classList.add("kids");

  // Xifres calculades amb les mateixes dades que la web
  const A3 = Object.keys(G.countries);
  const stateAt = (a, y) => { let r = null; for (const row of H.COUNTRIES[a].t) { if (row[0] <= y) r = row; else break; } return r; };
  const area = A3.reduce((s, a) => s + G.countries[a].a, 0);
  const pct = Math.round(A3.reduce((s, a) => s + (H.COLONIAL.has(stateAt(a, 1914)[1]) ? G.countries[a].a : 0), 0) / area * 100);
  const nPart = G.peoples.filter(p => p.s.length > 1 && p.s[1][1] >= 10).length;

  const T = {
    ca: { eyebrow: "Atles de denúncia · 1870–avui", title: "Àfrica<br>esquarterada", badge: "🏫 Versió per a escoles · estil pedagògic",
          sub: kids ? "Com Europa es va repartir l'Àfrica, i com els pobles africans van resistir. T'ho explica el Baobab." : "Com el colonialisme europeu va traçar fronteres sobre els regnes, els pobles i les llengües d'Àfrica.",
          stats: [[`${pct}%`, "del territori sota domini europeu el 1914"], [nPart, "pobles partits per les fronteres"], ["0", "africans a la Conferència de Berlín"]] },
    en: { eyebrow: "An atlas of denunciation · 1870–today", title: "Africa<br>Carved Up", badge: "🏫 School edition · teaching style",
          sub: kids ? "How Europe divided up Africa, and how African peoples resisted. Told by the Baobab." : "How European colonialism drew borders over Africa's kingdoms, peoples and languages.",
          stats: [[`${pct}%`, "of the land under European rule in 1914"], [nPart, "peoples split by the borders"], ["0", "Africans at the Berlin Conference"]] }
  }[lang];
  document.getElementById("eyebrow").textContent = T.eyebrow;
  document.getElementById("title").innerHTML = T.title;
  document.getElementById("sub").textContent = T.sub;
  if (kids) { const b = document.getElementById("badge"); b.textContent = T.badge; b.hidden = false; document.getElementById("eyebrow").hidden = true; }
  document.getElementById("stats").innerHTML = T.stats.map(([n, t]) => `<div><b>${n}</b><span>${t}</span></div>`).join("");

  // Mapa de 1914, amb les fronteres actuals a sobre
  const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("map");
  const [, , W, Hh] = G.viewBox;
  svg.setAttribute("viewBox", `-10 -10 ${W + 20} ${Hh + 20}`);
  svg.setAttribute("width", Math.round(630 * (W + 20) / (Hh + 20)));
  const path = (d, a) => { const p = document.createElementNS(NS, "path"); p.setAttribute("d", d); for (const k in a) p.setAttribute(k, a[k]); svg.append(p); };
  path(G.context, { fill: kids ? "#e9dfcc" : "#26211c" });
  for (const p of G.p1914) {
    const code = (H.P1914[p.n] || [null, "AF"])[1];
    path(p.d, { fill: code === "AF" ? "#e3b23c" : H.POWERS[code].color, stroke: kids ? "#fbf5e9" : "#14110f", "stroke-width": 2.2 });
  }
  for (const a of A3) path(G.countries[a].d, { fill: "none", stroke: kids ? "#2b211855" : "#ffffff40", "stroke-width": 1, "stroke-dasharray": "4 3" });
</script>
</body>
</html>
